name: "depquiet — Vulnerability Alert Triage"
description: "Cut through npm audit / pip-audit noise. Filter unreachable CVEs, devDependencies, low-EPSS, and known false positives."
author: "Samuel Rojas"

branding:
  icon: "shield"
  color: "green"

inputs:
  path:
    description: "Project path to scan"
    required: false
    default: "."
  epss-threshold:
    description: "EPSS score threshold (0.0-1.0). CVEs below this are filtered."
    required: false
    default: "0.1"
  offline:
    description: "Skip EPSS API calls"
    required: false
    default: "false"
  sarif:
    description: "Path to write SARIF output (for GitHub Code Scanning)"
    required: false
    default: ""
  templates:
    description: "Path to additional template directory"
    required: false
    default: ""
  policy:
    description: "Path to policy YAML file (default: .depquiet-policy.yaml in project root)"
    required: false
    default: ""
  sbom:
    description: "Path to write CycloneDX 1.5 SBOM (.json or .xml)"
    required: false
    default: ""
  sbom-format:
    description: "SBOM format: json (default) or xml. Inferred from --sbom extension if omitted."
    required: false
    default: ""
  ignore:
    description: "Path to .depquiet-ignore suppression file"
    required: false
    default: ""
  license:
    description: "Run license compliance analysis"
    required: false
    default: "false"
  baseline:
    description: "Path to a previous depquiet --json output. Only NEW findings trigger failure."
    required: false
    default: ""
  kev:
    description: "Check vulnerabilities against the CISA KEV catalog. KEV-listed CVEs are auto-escalated to ACTION."
    required: false
    default: "false"
  kev-file:
    description: "Path to a local KEV catalog JSON file (for air-gapped environments)"
    required: false
    default: ""
  html:
    description: "Write a self-contained interactive HTML report to this file path"
    required: false
    default: ""
  diff-base:
    description: "Path to a base scan JSON for diff comparison. When set, a diff summary is posted to the PR and GITHUB_STEP_SUMMARY."
    required: false
    default: ""
  pr-comment:
    description: "Post scan diff as a PR comment (requires diff-base, GITHUB_TOKEN, and a pull_request event)"
    required: false
    default: "false"
  fail-on-action:
    description: "Fail the workflow if ACTION items are found (deprecated: use fail-on)"
    required: false
    default: "true"
  fail-on:
    description: "Minimum severity to fail the build: critical, high, moderate, low, none. Overrides fail-on-action when set."
    required: false
    default: ""
  python-version:
    description: "Python version to use"
    required: false
    default: "3.13"

outputs:
  total:
    description: "Total vulnerabilities found by the audit tool"
    value: ${{ steps.run.outputs.total }}
  filtered:
    description: "Number of vulnerabilities filtered (noise)"
    value: ${{ steps.run.outputs.filtered }}
  action:
    description: "Number of vulnerabilities that need action"
    value: ${{ steps.run.outputs.action }}
  review:
    description: "Number of vulnerabilities that need review"
    value: ${{ steps.run.outputs.review }}
  sarif-file:
    description: "Path to SARIF file (if generated)"
    value: ${{ steps.run.outputs.sarif_file }}
  sbom-file:
    description: "Path to SBOM file (if generated)"
    value: ${{ steps.run.outputs.sbom_file }}
  diff-new:
    description: "Number of new findings in diff (when diff-base is set)"
    value: ${{ steps.diff.outputs.new }}
  diff-fixed:
    description: "Number of fixed findings in diff (when diff-base is set)"
    value: ${{ steps.diff.outputs.fixed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install depquiet
      shell: bash
      run: pip install depquiet

    - name: Run depquiet
      id: run
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_TEMPLATES: ${{ inputs.templates }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_SBOM_FORMAT: ${{ inputs.sbom-format }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_LICENSE: ${{ inputs.license }}
        INPUT_FAIL_ON_ACTION: ${{ inputs.fail-on-action }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_KEV: ${{ inputs.kev }}
        INPUT_KEV_FILE: ${{ inputs.kev-file }}
        INPUT_HTML: ${{ inputs.html }}
      run: |
        ARGS="--path $INPUT_PATH --epss-threshold $INPUT_EPSS_THRESHOLD --json"

        if [ "$INPUT_OFFLINE" = "true" ]; then
          ARGS="$ARGS --offline"
        fi

        if [ -n "$INPUT_SARIF" ]; then
          ARGS="$ARGS --sarif $INPUT_SARIF"
          echo "sarif_file=$INPUT_SARIF" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$INPUT_TEMPLATES" ]; then
          ARGS="$ARGS --templates $INPUT_TEMPLATES"
        fi

        if [ -n "$INPUT_POLICY" ]; then
          ARGS="$ARGS --policy $INPUT_POLICY"
        fi

        if [ -n "$INPUT_SBOM" ]; then
          ARGS="$ARGS --sbom $INPUT_SBOM"
          echo "sbom_file=$INPUT_SBOM" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$INPUT_SBOM_FORMAT" ]; then
          ARGS="$ARGS --sbom-format $INPUT_SBOM_FORMAT"
        fi

        if [ -n "$INPUT_IGNORE" ]; then
          ARGS="$ARGS --ignore $INPUT_IGNORE"
        fi

        if [ "$INPUT_LICENSE" = "true" ]; then
          ARGS="$ARGS --license"
        fi

        if [ -n "$INPUT_FAIL_ON" ]; then
          ARGS="$ARGS --fail-on $INPUT_FAIL_ON"
        fi

        if [ -n "$INPUT_BASELINE" ]; then
          ARGS="$ARGS --baseline $INPUT_BASELINE"
        fi

        if [ "$INPUT_KEV" = "true" ]; then
          ARGS="$ARGS --kev"
        fi

        if [ -n "$INPUT_KEV_FILE" ]; then
          ARGS="$ARGS --kev-file $INPUT_KEV_FILE"
        fi

        if [ -n "$INPUT_HTML" ]; then
          ARGS="$ARGS --html $INPUT_HTML"
        fi

        # Job summary — always write when GITHUB_STEP_SUMMARY is available
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          ARGS="$ARGS --summary $GITHUB_STEP_SUMMARY"
        fi

        set +e
        OUTPUT=$(depquiet $ARGS 2>&1)
        EXIT_CODE=$?
        set -e

        echo "$OUTPUT"

        # Parse JSON output for action outputs
        TOTAL=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('total',0))" 2>/dev/null || echo "0")
        FILTERED=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('filtered',0))" 2>/dev/null || echo "0")
        ACTION=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('action',0))" 2>/dev/null || echo "0")
        REVIEW=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('summary',{}).get('review',0))" 2>/dev/null || echo "0")

        echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
        echo "filtered=$FILTERED" >> "$GITHUB_OUTPUT"
        echo "action=$ACTION" >> "$GITHUB_OUTPUT"
        echo "review=$REVIEW" >> "$GITHUB_OUTPUT"

        # Determine failure behavior: --fail-on overrides fail-on-action
        if [ -n "$INPUT_FAIL_ON" ]; then
          # Explicit --fail-on: always pass to CLI, let depquiet decide exit code
          if [ "$EXIT_CODE" -ne 0 ]; then
            exit 1
          fi
        elif [ "$INPUT_FAIL_ON_ACTION" = "true" ] && [ "$EXIT_CODE" -ne 0 ]; then
          exit 1
        fi

    - name: Save scan JSON for diff
      if: inputs.diff-base != ''
      id: save-scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
        INPUT_OFFLINE: ${{ inputs.offline }}
        INPUT_TEMPLATES: ${{ inputs.templates }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_KEV: ${{ inputs.kev }}
        INPUT_KEV_FILE: ${{ inputs.kev-file }}
        INPUT_BASELINE: ${{ inputs.baseline }}
      run: |
        ARGS="--path $INPUT_PATH --epss-threshold $INPUT_EPSS_THRESHOLD --json"
        if [ "$INPUT_OFFLINE" = "true" ]; then ARGS="$ARGS --offline"; fi
        if [ -n "$INPUT_TEMPLATES" ]; then ARGS="$ARGS --templates $INPUT_TEMPLATES"; fi
        if [ -n "$INPUT_POLICY" ]; then ARGS="$ARGS --policy $INPUT_POLICY"; fi
        if [ -n "$INPUT_IGNORE" ]; then ARGS="$ARGS --ignore $INPUT_IGNORE"; fi
        if [ "$INPUT_KEV" = "true" ]; then ARGS="$ARGS --kev"; fi
        if [ -n "$INPUT_KEV_FILE" ]; then ARGS="$ARGS --kev-file $INPUT_KEV_FILE"; fi
        if [ -n "$INPUT_BASELINE" ]; then ARGS="$ARGS --baseline $INPUT_BASELINE"; fi
        depquiet $ARGS > /tmp/depquiet-head-scan.json 2>/dev/null || true

    - name: Run scan diff
      if: inputs.diff-base != ''
      id: diff
      shell: bash
      env:
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
      run: |
        DIFF_ARGS="diff $INPUT_DIFF_BASE /tmp/depquiet-head-scan.json --json"
        DIFF_OUTPUT=$(depquiet $DIFF_ARGS 2>/dev/null || echo '{"summary":{"new":0,"fixed":0,"changed":0,"unchanged":0}}')
        NEW=$(echo "$DIFF_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('new',0))" 2>/dev/null || echo "0")
        FIXED=$(echo "$DIFF_OUTPUT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('summary',{}).get('fixed',0))" 2>/dev/null || echo "0")
        echo "new=$NEW" >> "$GITHUB_OUTPUT"
        echo "fixed=$FIXED" >> "$GITHUB_OUTPUT"

        # Write markdown diff to step summary
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          depquiet diff "$INPUT_DIFF_BASE" /tmp/depquiet-head-scan.json --summary "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        fi

    - name: Post PR comment
      if: inputs.diff-base != '' && inputs.pr-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        COMMENT=$(depquiet diff "$INPUT_DIFF_BASE" /tmp/depquiet-head-scan.json --markdown 2>/dev/null || echo "⚠️ depquiet diff failed")
        # Delete previous depquiet comment if any
        EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[] | select(.body | startswith("## 🔍 depquiet")) | .id' 2>/dev/null || true)
        if [ -n "$EXISTING" ]; then
          for CID in $EXISTING; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$CID" 2>/dev/null || true
          done
        fi
        gh pr comment "$PR_NUMBER" --body "$COMMENT"

    - name: Upload SARIF to GitHub
      if: inputs.sarif != '' && always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif }}
        category: depquiet

    - name: Upload SBOM artifact
      if: inputs.sbom != '' && always()
      uses: actions/upload-artifact@v4
      with:
        name: depquiet-sbom
        path: ${{ inputs.sbom }}
