# Run the same checks as CI before each commit:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/depquiet/ --ignore-missing-imports
        language: system
        pass_filenames: false
        types: [python]
