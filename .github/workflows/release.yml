name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, tests, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(python -c 'import depquiet; print(depquiet.__version__)')"
          if [ "$pkg" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match depquiet.__version__ ($pkg)"
            exit 1
          fi
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/depquiet/ --ignore-missing-imports
      - name: Tests
        run: python -m pytest tests/ -q -m "not live"

  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: dist/*

      # `uses: samuelrojas-dev/depquiet@v0` follows the latest v0.x release.
      - name: Move major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" HEAD
          git push -f origin "refs/tags/$major"
