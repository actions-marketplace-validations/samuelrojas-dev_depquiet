name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, types, tests, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(python -c 'import depquiet; print(depquiet.__version__)')"
          if [ "$pkg" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match depquiet.__version__ ($pkg)"
            exit 1
          fi
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/depquiet/ --ignore-missing-imports
      - name: Tests
        run: python -m pytest tests/ -q -m "not live"

  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: verify
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

      # `uses: samuelrojas-dev/depquiet@v0` follows the latest v0.x release.
      - name: Move major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/$major"
